<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>智能助教 · 对话界面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f0f4fa 0%, #d9e2ef 100%);
            font-family: system-ui, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chat-app {
            max-width: 800px;
            width: 100%;
            height: 90vh;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.35), 0 4px 12px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #2c3e66;
            color: white;
            padding: 20px 24px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .title h1 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        .title p {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-top: 6px;
        }
        .badge {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #fefefe;
        }

        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: #e9eef3;
            border-radius: 10px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #b9c4d1;
            border-radius: 10px;
        }

        .message {
            display: flex;
            max-width: 85%;
            animation: fadeSlideUp 0.2s ease;
        }
        .user-message {
            align-self: flex-end;
        }
        .assistant-message {
            align-self: flex-start;
        }

        .bubble {
            padding: 12px 18px;
            border-radius: 26px;
            font-size: 0.95rem;
            line-height: 1.45;
            word-break: break-word;
            box-shadow: 0 1px 1px rgba(0,0,0,0.05);
        }
        .user-message .bubble {
            background: #2c3e66;
            color: white;
            border-bottom-right-radius: 6px;
        }
        .assistant-message .bubble {
            background: #eef2f7;
            color: #1a2634;
            border-bottom-left-radius: 6px;
        }

        .message-time {
            font-size: 0.7rem;
            margin-top: 5px;
            opacity: 0.6;
            text-align: right;
            padding-right: 6px;
        }
        .assistant-message .message-time {
            text-align: left;
            padding-left: 6px;
        }

        .chat-input-area {
            background: white;
            border-top: 1px solid #e2e8f0;
            padding: 16px 20px 24px;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .input-wrapper {
            flex: 1;
            background: #f3f6fa;
            border-radius: 32px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            border: 1px solid #e2edf7;
            transition: all 0.2s;
        }
        .input-wrapper:focus-within {
            border-color: #2c3e66;
            background: #ffffff;
            box-shadow: 0 0 0 2px rgba(44,62,102,0.2);
        }
        .input-wrapper input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 12px 0;
            font-size: 0.95rem;
            outline: none;
            font-family: inherit;
        }
        .input-wrapper input::placeholder {
            color: #9aaebf;
        }
        button {
            background: #2c3e66;
            border: none;
            color: white;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        button:hover {
            background: #1f2c48;
            transform: scale(0.97);
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 550px) {
            .message {
                max-width: 92%;
            }
            .chat-app {
                height: 95vh;
                border-radius: 28px;
            }
            .chat-header {
                padding: 14px 18px;
            }
            .title h1 {
                font-size: 1.3rem;
            }
            button {
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>
<div class="chat-app">
    <div class="chat-header">
        <div class="title">
            <h1>🧑‍🏫 智能助教</h1>
            <p>随时提问 · 随时解答</p>
        </div>
        <div class="badge">✨ 智能问答</div>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="message assistant-message">
            <div class="bubble">
                你好！我是智能助教 👋<br>
                有什么问题可以随时问我~
            </div>
        </div>
    </div>

    <div class="chat-input-area">
        <div class="input-wrapper">
            <input type="text" id="messageInput" placeholder="输入你的问题…" autocomplete="off">
        </div>
        <button id="sendBtn">📨 发送</button>
    </div>
</div>

<script>
    const inputField = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendBtn');
    const messagesContainer = document.getElementById('chatMessages');

    function getCurrentTime() {
        const now = new Date();
        return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    function addMessage(role, text) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}-message`;
        const time = getCurrentTime();
        messageDiv.innerHTML = `
            <div class="bubble">
                ${escapeHtml(text)}
                <div class="message-time">${time}</div>
            </div>
        `;
        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function handleSendMessage() {
        const message = inputField.value.trim();
        if (message === '') {
            return;
        }

        // 添加用户消息
        addMessage('user', message);
        
        // 清空输入框
        inputField.value = '';
        inputField.focus();
        
        // 添加助教占位回复（提示后续接入API）
        addMessage('assistant', '收到你的问题！后续接入API后，我就能智能回答啦~');
    }

    sendButton.addEventListener('click', handleSendMessage);
    inputField.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleSendMessage();
        }
    });
</script>
</body>
</html>
