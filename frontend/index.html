<!-- frontend/index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据结构课程智能助教</title>
    
    <!-- 样式 -->
    <link rel="stylesheet" href="css/style.css?v=20261013" />
    
    <!-- 第三方库：优先加载本地副本（frontend/js/vendor），加载不到再回退到 CDN。
         本地化是为了避免 CDN 不可达时 marked 缺失，导致 Markdown 整体退化成纯文本。 -->
    <script src="js/vendor/purify.min.js?v=20261013"></script>
    <script>
        window.DOMPurify || document.write('<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"><\/script>');
    </script>
    
    <script src="js/vendor/marked.min.js?v=20261013"></script>
    <script>
        window.marked || document.write('<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"><\/script>');
    </script>
    
    <!-- MathJax 配置和加载 -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            },
            svg: {
                fontCache: 'global'
            },
            options: {
                enableMenu: false,
                renderActions: {
                    addMenu: []
                }
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
</head>
<body>
    <div class="app-container">
        <!-- ===== 头部 ===== -->
        <header class="app-header">
            <h1>📚 数据结构 <span class="highlight">智能助教</span></h1>
            <p class="subtitle">基于课程知识库的 RAG 问答系统</p>
        </header>
        
        <!-- ===== 状态栏 ===== -->
        <div class="status-bar" id="statusBar">
            <span>💡 输入数据结构课程相关问题</span>
            <span>
                <span id="statusBadge" class="status-badge status-checking">🟡 检测中...</span>
                <span style="margin-left:12px;color:#aab5c5;" id="statusDetail">正在连接后端服务...</span>
                <span id="retryHint" style="margin-left:12px;font-size:11px;color:#aab5c5;display:none;">
                    （点击重试）
                </span>
            </span>
        </div>
        
        <!-- ===== 输入区域 ===== -->
        <section class="input-section">
            <div class="input-group">
                <textarea 
                    id="questionInput" 
                    placeholder="请输入数据结构课程问题，例如：顺序表为什么支持随机访问？"
                    rows="2"
                ></textarea>
                <button class="btn-submit" id="submitBtn">
                    <span>✚</span> 提问
                </button>
            </div>
            <div style="margin-top:10px;font-size:12px;color:#aab5c5;">
                <kbd>Enter</kbd> 提交 · <kbd>Ctrl+Enter</kbd> 换行
            </div>
        </section>
        
        <!-- ===== 加载状态 ===== -->
        <section class="loading-section" id="loadingSection">
            <div class="loading-spinner"></div>
            <div class="loading-text" id="loadingText">正在检索知识库并生成回答...</div>
            <div class="loading-time" id="loadingTime"></div>
        </section>
        
        <!-- ===== 回答区域 ===== -->
        <section class="answer-section" id="answerSection">
            <!-- 本轮问题 -->
            <div class="question-display">
                <div class="question-display-label">❓ 问题</div>
                <div class="question-display-content" id="questionDisplayContent"></div>
            </div>

            <!-- 渲染降级提示：Markdown 组件不可用时展示，避免用户只看到原始文本却不知道为什么 -->
            <div class="render-notice" id="renderNotice" style="display:none;">
                <span class="render-notice-icon">⚠️</span>
                <span>Markdown 渲染组件未加载，当前以纯文本显示，请刷新页面重试。</span>
            </div>

            <!-- 范围外提示：out_of_scope=true 时展示，不属于系统错误 -->
            <div class="scope-notice" id="scopeNotice" style="display:none;">
                <span class="scope-notice-icon">ℹ️</span>
                <span class="scope-notice-text" id="scopeNoticeText">当前知识库暂无足够资料</span>
            </div>

            <div class="answer-header">
                <span class="answer-header-left">
                    <span class="label">💬 回答</span>
                    <span class="mode-badge" id="modeBadge" style="display:none;"></span>
                </span>
                <span class="latency" id="answerLatency"></span>
            </div>
            <div class="answer-content" id="answerContent"></div>
            
            <!-- 来源列表 -->
            <div class="sources-section">
                <div class="sources-label">
                    📖 参考资料 
                    <span class="source-count" id="sourcesCount">0</span>
                </div>
                
                <!-- 来源列表 -->
                <div class="sources-list" id="sourcesList"></div>
                
                <!-- 来源为空时的提示 -->
                <div class="empty-sources" id="emptySources" style="display:none;">
                    <span class="icon">ℹ️</span>
                    <span>本次回答未引用课程资料</span>
                </div>
            </div>
        </section>
        
        <!-- ===== 错误提示 ===== -->
        <section class="error-section" id="errorSection">
            <div>
                <span class="error-icon">⚠️</span>
                <span class="error-code" id="errorCode">ERROR</span>
            </div>
            <div class="error-message" id="errorMessage">错误详情</div>
        </section>
        
        <!-- ===== 历史记录 ===== -->
        <section class="history-section">
            <div class="history-header">
                <span class="history-label">📋 历史记录</span>
                <div>
                    <span class="history-count" id="historyCount">共 0 条</span>
                    <button class="btn-clear-history" id="clearHistoryBtn">清空</button>
                </div>
            </div>
            <div class="history-list" id="historyList">
                <div class="empty-history">暂无问答记录</div>
            </div>
        </section>
    </div>
    
    <!-- ===== JavaScript =====
         ?v= 是缓存版本号。静态服务（python -m http.server / Live Server）不发 Cache-Control，
         浏览器会启发式缓存 JS/CSS，改完代码刷新后可能还在跑旧版本。
         改动前端后把这里的版本号一起改掉即可强制拉新。 -->
    <script src="js/config.js?v=20261013"></script>
    <script src="js/mock.js?v=20261013"></script>
    <script src="js/api.js?v=20261013"></script>
    <script src="js/app.js?v=20261014c"></script>
</body>
</html>
