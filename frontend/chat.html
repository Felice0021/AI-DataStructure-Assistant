<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>智能助教 · 对话界面</title>
    <!-- Markdown 渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f0f4fa 0%, #d9e2ef 100%);
            font-family: system-ui, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chat-app {
            max-width: 800px;
            width: 100%;
            height: 90vh;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.35), 0 4px 12px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #2c3e66;
            color: white;
            padding: 20px 24px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .title h1 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        .title p {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-top: 6px;
        }
        .badge {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #fefefe;
        }

        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: #e9eef3;
            border-radius: 10px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #b9c4d1;
            border-radius: 10px;
        }

        .message {
            display: flex;
            max-width: 85%;
            animation: fadeSlideUp 0.2s ease;
        }
        .user-message {
            align-self: flex-end;
        }
        .assistant-message {
            align-self: flex-start;
        }

        .bubble {
            padding: 12px 18px;
            border-radius: 26px;
            font-size: 0.95rem;
            line-height: 1.45;
            word-break: break-word;
            box-shadow: 0 1px 1px rgba(0,0,0,0.05);
        }
        .user-message .bubble {
            background: #2c3e66;
            color: white;
            border-bottom-right-radius: 6px;
        }
        .assistant-message .bubble {
            background: #eef2f7;
            color: #1a2634;
            border-bottom-left-radius: 6px;
        }

        /* Markdown 内容样式 */
        .markdown-body {
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            margin: 8px 0 6px 0;
            font-weight: 600;
        }
        .markdown-body h2 {
            font-size: 1.2rem;
            border-left: 3px solid #2c3e66;
            padding-left: 10px;
        }
        .markdown-body h3 {
            font-size: 1.05rem;
            color: #2c3e66;
        }
        .markdown-body ul, .markdown-body ol {
            margin: 6px 0;
            padding-left: 20px;
        }
        .markdown-body li {
            margin: 2px 0;
        }
        .markdown-body p {
            margin: 6px 0;
        }
        .markdown-body code {
            background: #e2e8f0;
            padding: 2px 5px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 0.85rem;
            color: #d63384;
        }
        .markdown-body pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .markdown-body pre code {
            background: transparent;
            color: inherit;
            padding: 0;
            font-size: 0.85rem;
        }
        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
            margin: 8px 0;
            font-size: 0.85rem;
        }
        .markdown-body th, .markdown-body td {
            border: 1px solid #cbd5e1;
            padding: 6px 8px;
            text-align: left;
        }
        .markdown-body th {
            background: #f1f5f9;
            font-weight: 600;
        }
        .markdown-body blockquote {
            border-left: 4px solid #2c3e66;
            margin: 8px 0;
            padding-left: 12px;
            color: #475569;
        }
        .markdown-body strong {
            color: #2c3e66;
        }

        .message-time {
            font-size: 0.7rem;
            margin-top: 8px;
            opacity: 0.6;
            text-align: right;
            padding-right: 4px;
        }
        .assistant-message .message-time {
            text-align: left;
            padding-left: 4px;
        }

        .chat-input-area {
            background: white;
            border-top: 1px solid #e2e8f0;
            padding: 16px 20px 24px;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .input-wrapper {
            flex: 1;
            background: #f3f6fa;
            border-radius: 32px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            border: 1px solid #e2edf7;
            transition: all 0.2s;
        }
        .input-wrapper:focus-within {
            border-color: #2c3e66;
            background: #ffffff;
            box-shadow: 0 0 0 2px rgba(44,62,102,0.2);
        }
        .input-wrapper input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 12px 0;
            font-size: 0.95rem;
            outline: none;
            font-family: inherit;
        }
        .input-wrapper input::placeholder {
            color: #9aaebf;
        }
        button {
            background: #2c3e66;
            border: none;
            color: white;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        button:hover {
            background: #1f2c48;
            transform: scale(0.97);
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 550px) {
            .message {
                max-width: 92%;
            }
            .chat-app {
                height: 95vh;
                border-radius: 28px;
            }
            .chat-header {
                padding: 14px 18px;
            }
            .title h1 {
                font-size: 1.3rem;
            }
            button {
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>
<div class="chat-app">
    <div class="chat-header">
        <div class="title">
            <h1>🧑‍🏫 智能助教</h1>
            <p>随时提问 · 随时解答</p>
        </div>
        <div class="badge">✨ 智能问答</div>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="message assistant-message">
            <div class="bubble markdown-body">
                你好！我是智能助教 👋<br><br>
                有什么问题可以随时问我~<br>
            </div>
        </div>
    </div>

    <div class="chat-input-area">
        <div class="input-wrapper">
            <input type="text" id="messageInput" placeholder="输入你的问题…" autocomplete="off">
        </div>
        <button id="sendBtn">📨 发送</button>
    </div>
</div>

<script>
    const inputField = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendBtn');
    const messagesContainer = document.getElementById('chatMessages');

    // API 配置
    const API_URL = 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions';
    const API_KEY = 'sk-e7c4ea0a9d2d4a52a26408bf8d2f0d06';
    const MODEL_NAME = 'qwen-plus';

    function getCurrentTime() {
        const now = new Date();
        return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    function addMessage(role, text, isMarkdown = false) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}-message`;
        const time = getCurrentTime();
        
        let content;
        if (role === 'assistant') {
            // 助手消息：渲染 Markdown
            const renderedHtml = marked.parse(text);
            content = `<div class="bubble markdown-body">${renderedHtml}<div class="message-time">${time}</div></div>`;
        } else {
            // 用户消息：纯文本转义
            content = `<div class="bubble">${escapeHtml(text)}<div class="message-time">${time}</div></div>`;
        }
        
        messageDiv.innerHTML = content;
        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        return messageDiv;
    }

    function addThinkingMessage() {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message assistant-message';
        const time = getCurrentTime();
        messageDiv.innerHTML = `
            <div class="bubble markdown-body">
                🤔 思考中...
                <div class="message-time">${time}</div>
            </div>
        `;
        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        return messageDiv;
    }

    function updateMessage(messageDiv, text) {
        const time = getCurrentTime();
        const renderedHtml = marked.parse(text);
        messageDiv.innerHTML = `
            <div class="bubble markdown-body">
                ${renderedHtml}
                <div class="message-time">${time}</div>
            </div>
        `;
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function callQwenAPI(question) {
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: MODEL_NAME,
                    messages: [
                        { 
                            role: 'system',
                            content: `你是一个专业、友好的智能助教。回答用户问题时，请务必使用 Markdown 格式排版，让回答清晰易读。具体要求：
1. 使用 ## 表示小标题（不要用 # 一级标题）
2. 使用 - 表示无序列表，1. 2. 3. 表示有序列表
3. 使用 **粗体** 强调关键概念
4. 提到代码或字段名时用 \`反引号\` 包裹
5. 多行代码块使用 \`\`\` 包裹并标注语言
6. 对比数据时使用表格（| 列1 | 列2 |）
7. 重要信息用 > 引用块突出
保持回答结构清晰、内容准确。`
                        },
                        { 
                            role: 'user', 
                            content: question 
                        }
                    ],
                    max_tokens: 1000,
                    temperature: 0.7
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || `HTTP ${response.status}`);
            }

            const data = await response.json();
            const reply = data.choices[0].message.content;
            return reply;
            
        } catch (error) {
            console.error('API调用失败:', error);
            return `❌ 抱歉，调用AI服务时出错了：${error.message}\n\n请检查网络连接`;
        }
    }

    async function handleSendMessage() {
        const message = inputField.value.trim();
        if (message === '') return;

        addMessage('user', message);
        inputField.value = '';
        inputField.focus();

        const thinkingMsg = addThinkingMessage();
        const reply = await callQwenAPI(message);
        updateMessage(thinkingMsg, reply);
    }

    sendButton.addEventListener('click', handleSendMessage);
    inputField.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleSendMessage();
        }
    });
</script>
</body>
</html>
