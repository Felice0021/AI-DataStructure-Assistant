name: ds-assistant-v2

services:
  db:
    # PostgreSQL 17.11 + pgvector 0.8.7; multiarch index includes linux/arm64.
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    platform: ${DS_V2_DB_PLATFORM:-linux/arm64}
    environment:
      POSTGRES_DB: ${DS_V2_DB_NAME:-ds_assistant_v2}
      POSTGRES_USER: ${DS_V2_DB_USER:-ds_assistant_v2}
      POSTGRES_PASSWORD: ${DS_V2_DB_PASSWORD:?Run python deploy/v2/init_env.py first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
    name: ds-assistant-v2-postgres-data
